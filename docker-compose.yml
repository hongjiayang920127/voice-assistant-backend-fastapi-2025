version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount the app directory for development hot-reloading
      - ./app:/app/app
      # Mount alembic config and scripts
      - ./alembic.ini:/app/alembic.ini
      - ./alembic:/app/alembic
    # Add dependency on the db service, wait for it to be healthy
    depends_on:
      db:
        condition: service_healthy
    # Command is already defined in Dockerfile, so we don't need it here
    # unless overriding for specific purposes. 

  db:
    image: postgres:15-alpine # Use official PostgreSQL image
    volumes:
      - postgres_data:/var/lib/postgresql/data/ # Persist data
    ports:
      - "5432:5432" # Map host port 5432 to container port 5432
    env_file:
      - .env # Load environment variables (POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB)
    environment:
      # Default values if not set in .env (match default DATABASE_URL)
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-voice_assistant_db}
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-user} -d $${POSTGRES_DB:-voice_assistant_db}"]
        interval: 5s
        timeout: 5s
        retries: 5

volumes:
  postgres_data: # Define the named volume